apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment1
  labels:
    name:  my-deployment1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: httpd 
  template:
    metadata:
      labels:
        app: httpd 
    spec:
      containers:
      - name: env-demo-container
        image: nginx
        ports:
         - containerPort: 80
        envFrom:
         - configMapRef:
             name: env-demo-configmap 